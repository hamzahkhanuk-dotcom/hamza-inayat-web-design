<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamza Inayat — Selected Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;color:#f2f0ea;font-family:Inter,Helvetica,Arial,sans-serif}
#c{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
#c.drag{cursor:grabbing}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:26px 30px;pointer-events:none;z-index:5}
.brand b{display:block;font-weight:900;font-size:20px;letter-spacing:-.02em}
.brand span{color:#8d8a83;display:block;margin-top:6px}
header a{pointer-events:auto;color:#f2f0ea;text-decoration:none;border:1px solid rgba(255,255,255,.18);padding:10px 14px;border-radius:999px;transition:.25s;background:rgba(0,0,0,.4);backdrop-filter:blur(6px)}
header a:hover{background:#f2f0ea;color:#000}
.hint{position:fixed;left:30px;bottom:28px;color:#8d8a83;z-index:5;pointer-events:none}
.chips{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(14,14,14,.8);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);z-index:5}
.chips button{background:none;border:0;color:#a9a59c;padding:9px 15px;border-radius:999px;cursor:pointer;font:inherit}
.chips button.on{background:#f2f0ea;color:#000}
.chips button:hover:not(.on){color:#fff}
#label{position:fixed;left:0;top:0;z-index:4;pointer-events:none;will-change:transform;text-shadow:0 2px 18px rgba(0,0,0,.9)}
#label .k{color:#c4c0b7}
#label h3{font-weight:900;font-size:34px;letter-spacing:-.03em;line-height:1;margin:8px 0 10px;white-space:nowrap}
#label .tg{display:flex;gap:5px}
#label .tg span{background:#f2f0ea;color:#000;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:500}
#label{transition:opacity .3s}
#panel{position:fixed;right:30px;top:50%;width:min(400px,calc(100vw - 40px));transform:translate(30px,-50%);opacity:0;pointer-events:none;z-index:6;
background:rgba(14,14,14,.82);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;transition:opacity .45s,transform .6s cubic-bezier(.2,.9,.2,1)}
#panel.open{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#panel .img{height:220px;background:#111 center top/cover no-repeat}
#panel .body{padding:22px 24px 24px}
#panel .k{color:var(--acc,#ff4d3a)}
#panel h2{font-weight:900;font-size:32px;letter-spacing:-.03em;line-height:1;margin:10px 0 12px}
#panel p{color:#c4c0b7;font-size:14.5px;line-height:1.55}
#panel .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
#panel .tags span{border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 10px;color:#a9a59c;font-size:10px}
#panel .btns{display:flex;gap:8px;margin-top:20px}
#panel .btns a,#panel .btns button{font:inherit;cursor:pointer;text-decoration:none;padding:12px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#f2f0ea;background:none;transition:.25s}
#panel .btns a{background:var(--acc,#ff4d3a);border-color:transparent;color:#0b0b0b;font-weight:500}
#panel .btns button:hover{background:rgba(255,255,255,.08)}
#intro{position:fixed;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;background:#000;transition:opacity 1.2s .9s}
#intro h1{font-weight:900;font-style:italic;font-size:clamp(28px,4vw,52px);letter-spacing:-.03em}
#intro.gone{opacity:0}
@media(max-width:700px){
 header{padding:18px}.hint{display:none}
 .chips{bottom:14px}.chips button{padding:8px 11px}
 #panel{right:auto;left:50%;top:auto;bottom:74px;transform:translate(-50%,30px)}
 #panel.open{transform:translate(-50%,0)}
 #panel .img{height:140px}
 #label h3{font-size:24px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro"><h1>“There’s a website for that.”</h1></div>
<header>
  <div class="brand"><b>HAMZA INAYAT</b><span class="mono">Web design · London</span></div>
  <a class="mono" href="https://www.fiverr.com/hamzainayat397" target="_blank" rel="noopener">Hire me ↗</a>
</header>
<div id="label"><div class="k mono" id="lK"></div><h3 id="lT"></h3><div class="tg mono" id="lG"></div></div>
<div class="hint mono">Move to explore · Drag · Click to open</div>
<div class="chips mono" id="chips">
  <button class="on" data-f="-1">All</button>
  <button data-f="0">Websites</button>
  <button data-f="1">Shopify</button>
  <button data-f="2">Team</button>
</div>
<div id="panel">
  <div class="img" id="pImg"></div>
  <div class="body">
    <div class="k mono" id="pK"></div>
    <h2 id="pT"></h2>
    <p id="pD"></p>
    <div class="tags mono" id="pTags"></div>
    <div class="btns mono"><a id="pLink" target="_blank" rel="noopener"></a><button id="pClose" type="button">Close</button></div>
  </div>
</div>

const U={uOffset:{value:new THREE.Vector2()},uLens:{value:new THREE.Vector2()},uRes:{value:new THREE.Vector2(W,H)},
 uTile:{value:new THREE.Vector2(22,33)},uCell:{value:new THREE.Vector2(28,40)},uField:{value:new THREE.Vector2()},
 uTime:{value:0},uA:{value:3.6},uR:{value:46},uAtlas:{value:atlas},uFilter:{value:-1},uSel:{value:-1},uIntro:{value:0},uVel:{value:new THREE.Vector2()}};
const VS=`
attribute vec2 aGrid;attribute float aTex;attribute float aType;attribute float aId;
uniform vec2 uOffset,uLens,uRes,uTile,uCell,uField,uVel;uniform float uTime,uA,uR,uFilter,uSel,uIntro;
varying vec2 vUv;varying float vTex,vG,vDim,vEdge;
void main(){
 vec2 c=aGrid*uCell+uOffset;
 c=mod(c+uField*0.5,uField)-uField*0.5;
 c+=vec2(sin(c.y*0.007+uTime*0.55),cos(c.x*0.006+uTime*0.45))*5.0;
 c+=uVel*sin(c.yx*0.004+uTime)*6.0;
 vec2 n=c/(uRes*0.5);float r2=dot(n,n);
 float b=1.0-0.085*r2;c*=b;
 vec2 d=c-uLens;float r=length(d);
 vec2 de=d/vec2(1.3,1.0);float rn=length(de)/uR;float L=1.0/(1.0+rn*rn);
 float g=L*L;
 float s=1.0+uA*L;
 vec2 p=uLens+d*s;
 float intro=smoothstep(0.0,1.0,uIntro*1.6-length(n)*0.5);
 float radial=max(0.35,1.0+uA*(1.0-rn*rn)*L*L);
 float k=b*mix(0.2,1.0,intro)*(aId==uSel?1.08:1.0);
 vec2 q=position.xy*uTile*k;
 vec2 u=r>0.001?d/r:vec2(1.0,0.0);
 float qr=dot(q,u);vec2 qt=q-qr*u;
 vec2 pos=p+u*qr*radial+qt*s;
 vUv=uv;vTex=aTex;vG=g;vEdge=r2;
 vDim=(uFilter<0.0||abs(aType-uFilter)<0.5)?1.0:0.12;
 vDim*=intro;
 gl_Position=projectionMatrix*viewMatrix*vec4(pos,g,1.0);
}`;
const FS=`
uniform sampler2D uAtlas;varying vec2 vUv;varying float vTex,vG,vDim,vEdge;
float rr(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r;}
void main(){
 vec2 p=vUv-0.5;
 float dd=rr(p*vec2(1.0,1.5),vec2(0.5,0.75),0.13);
 if(dd>0.0)discard;
 float col=mod(vTex,5.0),row=floor(vTex/5.0);
 vec2 uv=vec2((col+vUv.x)/5.0,1.0-(row+1.0)/2.0+vUv.y/2.0);
 vec3 c=texture2D(uAtlas,uv).rgb;
 float lit=mix(0.38,1.0,smoothstep(0.02,0.5,vG));
 lit*=1.0-0.45*clamp(vEdge*0.6,0.0,1.0);
 gl_FragColor=vec4(c*lit*vDim,1.0);
}`;
let mesh=null,grid=[];
function build(){

 const cell=U.uCell.value;
 const cols=Math.ceil(W*1.3/cell.x),rows=Math.ceil(H*1.3/cell.y);
 U.uField.value.set(cols*cell.x,rows*cell.y);
 const g=new THREE.InstancedBufferGeometry();
 const base=new THREE.PlaneGeometry(1,1);g.index=base.index;g.attributes.position=base.attributes.position;g.attributes.uv=base.attributes.uv;
 const n=cols*rows,ag=new Float32Array(n*2),at=new Float32Array(n),ay=new Float32Array(n),ai=new Float32Array(n);
 grid=[];let k=0;const tex=[];
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
  let t=Math.floor(Math.abs(Math.sin(x*12.9898+y*78.233)*43758.5453)%10);
  const left=x>0?tex[k-1]:-1,up=y>0?tex[k-cols]:-1;
  while(t===left||t===up)t=(t+1)%10;
  tex.push(t);
  ag[k*2]=x-cols/2;ag[k*2+1]=y-rows/2;at[k]=t;ay[k]=P[t].f;ai[k]=k;grid.push([x-cols/2,y-rows/2,t]);k++;
 }
 g.setAttribute('aGrid',new THREE.InstancedBufferAttribute(ag,2));
 g.setAttribute('aTex',new THREE.InstancedBufferAttribute(at,1));
 g.setAttribute('aType',new THREE.InstancedBufferAttribute(ay,1));
 g.setAttribute('aId',new THREE.InstancedBufferAttribute(ai,1));
 g.instanceCount=n;
 mesh=new THREE.Mesh(g,new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS}));
 mesh.frustumCulled=false;S.add(mesh);
}

 if(down){const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);off.x+=dx;off.y-=dy;vx=dx;vy=-dy;}
});
cv.addEventListener('pointerdown',e=>{down=true;moved=0;px=e.clientX;py=e.clientY;[mx,my]=toLocal(e);hasMouse=true;cv.classList.add('drag');cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',e=>{down=false;cv.classList.remove('drag');
 if(moved<6){ if(e.pointerType!=='mouse'){[mx,my]=toLocal(e);lens.set(mx,my);} const id=pick(); if(id>=0)openP(id); else closeP(); }});
cv.addEventListener('pointerleave',()=>{if(!down)hasMouse=false});

// replicate shader position (without lens) to find tile under lens
function centerOf(i,t){
 const g=grid[i],cell=U.uCell.value,F=U.uField.value;
 let x=g[0]*cell.x+off.x,y=g[1]*cell.y+off.y;
 x=((x+F.x/2)%F.x+F.x)%F.x-F.x/2;y=((y+F.y/2)%F.y+F.y)%F.y-F.y/2;
 const x0=x,y0=y;
 x+=Math.sin(y0*.007+t*.55)*5;y+=Math.cos(x0*.006+t*.45)*5;
 const nx=x/(W/2),ny=y/(H/2),b=1-.085*(nx*nx+ny*ny);return [x*b,y*b];
}
function pick(){
 const t=U.uTime.value;let best=-1,bd=1e9;
 for(let i=0;i<grid.length;i++){const c=centerOf(i,t);const d=(c[0]-lens.x)**2+(c[1]-lens.y)**2;if(d<bd){bd=d;best=i;}}
 if(best<0)return -1;
 const ty=P[grid[best][2]].f;if(filter>=0&&ty!==filter)return -1;
 return bd<(U.uCell.value.x*1.2)**2?best:-1;
}
const label=document.getElementById('label'),lK=document.getElementById('lK'),lT=document.getElementById('lT'),lG=document.getElementById('lG');
let shown=-1;
function showLabel(id){
 if(id===shown)return;shown=id;
 if(id<0){label.style.opacity=0;return}
 const p=P[grid[id][2]];lK.textContent=p.k;lT.textContent=p.t;lG.innerHTML=p.tags.map(t=>`<span>${t}</span>`).join('');label.style.opacity=1;
}
const pan=document.getElementById('panel');
function openP(id){
 const p=P[grid[id][2]];openId=id;U.uSel.value=id;
 pan.style.setProperty('--acc',p.acc);
 const idx=grid[id][2];document.getElementById('pImg').style.backgroundImage=`url(${ATLAS})`;
 document.getElementById('pImg').style.backgroundSize='500% 200%';
 document.getElementById('pImg').style.backgroundPosition=`${(idx%5)*25}% ${Math.floor(idx/5)*100}%`;
 document.getElementById('pK').textContent=p.k;document.getElementById('pT').textContent=p.t;document.getElementById('pD').textContent=p.d;
 document.getElementById('pTags').innerHTML=p.tags.map(t=>`<span>${t}</span>`).join('');
 const a=document.getElementById('pLink');a.href=p.link;a.textContent=p.lt;pan.classList.add('open');
}
function closeP(){pan.classList.remove('open');openId=-1;U.uSel.value=-1;}
document.getElementById('pClose').onclick=closeP;
addEventListener('keydown',e=>{if(e.key==='Escape')closeP()});
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x===b));
 filter=+b.dataset.f;U.uFilter.value=filter;shown=-2;
});

const clock=new THREE.Clock();let start=null;
function loop(){
 const t=clock.getElapsedTime();U.uTime.value=t;
 if(document.getElementById('intro').classList.contains('gone')){if(start===null)start=t;U.uIntro.value=Math.min(1.5,(t-start)*.6);}
 if(!down){off.x+=vx;off.y+=vy;vx*=.95;vy*=.95;if(Math.abs(vx)<.25&&!hasMouse)vx=-.25;}
 U.uVel.value.x+=((down?vx:vx)*.02-U.uVel.value.x)*.1;U.uVel.value.y+=(vy*.02-U.uVel.value.y)*.1;
 let tx=hasMouse?mx:Math.sin(t*.3)*W*.12,ty=hasMouse?my:Math.cos(t*.23)*H*.1;
 {let bd=1e9,bc=null;for(let i=0;i<grid.length;i++){const c=centerOf(i,t);const d=(c[0]-tx)**2+(c[1]-ty)**2;if(d<bd){bd=d;bc=c;}}if(bc){tx=bc[0];ty=bc[1];}}
 lens.x+=(tx-lens.x)*.12;lens.y+=(ty-lens.y)*.12;
 const targetA=(down?2.2:3.6);U.uA.value+=(targetA-U.uA.value)*.08;
 hover=pick();showLabel(hover);
 const R0=U.uR.value;
 const lxp=Math.min(W-380,W/2+lens.x-R0*3.2),lyp=Math.min(H-170,H/2-lens.y+R0*3.4);
 label.style.transform=`translate(${Math.max(16,lxp)}px,${Math.max(70,lyp)}px)`;
 R.render(S,cam);requestAnimationFrame(loop);
}
loop();
</script>
</body>
